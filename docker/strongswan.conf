# Minimal strongswan.conf for the vici-php development container.
# The VICI plugin is enabled by default; these overrides only add verbose
# stderr logging so `docker compose logs` is useful while debugging.

charon {
    filelog {
        stderr {
            default = 1
            ike = 2
            cfg = 2
        }
    }
    syslog {
        daemon {
            default = 1
        }
    }
}

include strongswan.d/*.conf
